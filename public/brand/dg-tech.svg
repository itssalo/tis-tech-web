<svg xmlns="http://www.w3.org/2000/svg" viewBox="250 130 1200 550" width="1200" height="550" role="img" aria-labelledby="title desc">
  <title id="title">DG TECH</title>
  <desc id="desc">Logo de DG TECH con tres círculos rojo, gris y amarillo sobre fondo transparente.</desc>

  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7"/>
      <feOffset dx="0" dy="8" result="o"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.22"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="2" dy="8" result="o"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.20"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <circle cx="615" cy="294" r="72" fill="#C5163A" stroke="#F4F4F4" stroke-width="5"/>
    <circle cx="830" cy="294" r="72" fill="#8F8F8F" stroke="#F4F4F4" stroke-width="5"/>
    <circle cx="1045" cy="294" r="72" fill="#D59A18" stroke="#F4F4F4" stroke-width="5"/>
  </g>

  <g fill="#050505" stroke="#FFFFFF" stroke-width="4" paint-order="stroke fill"
     font-family="DejaVu Sans, Arial, sans-serif" font-size="225" font-weight="400"
     letter-spacing="12" filter="url(#textShadow)">
    <text x="290" y="622">DG TECH</text>
  </g>
</svg>
